<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mot de passe</title>
<style>
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#login,#black{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#pw{width:min(80%,320px);padding:14px;font-size:18px;border:0;border-radius:8px;background:#fff;color:#000;text-align:center;outline:none}
.btn{padding:12px 28px;font-size:16px;border:0;border-radius:8px;background:#fff;color:#000;cursor:pointer}
#test{background:#333;color:#fff;font-size:14px;padding:8px 18px}
#err{color:#f66;min-height:20px;font-size:14px;text-align:center}
#status{color:#9cf;min-height:20px;font-size:13px;text-align:center;padding:0 12px}
#black{display:none;font-size:26px;background:#000;z-index:50;text-align:center;padding:0 16px}

#scene{position:fixed;inset:0;display:none;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;overflow:hidden}
#bg>div{position:absolute}
#room{position:absolute;inset:0}
#status2{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);text-align:center;font-size:11px;color:#fff;opacity:.85;z-index:40}
.clock{width:44px;height:44px;border:4px solid #444;border-radius:50%;background:#fff}
.clock i{position:absolute;left:50%;bottom:50%;width:2px;height:16px;background:#222;transform-origin:50% 100%;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.ch{display:none;position:absolute;bottom:20%;width:17%;transition-property:left,bottom;transition-timing-function:linear;z-index:5}
.ch.show{display:block}
.fl{transition:transform .4s}
.flip .fl{transform:scaleX(-1)}
.ch svg{width:100%;height:auto;display:block;overflow:visible;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
.ch .nm{text-align:center;font-size:12px;color:#222;font-weight:bold;margin-top:2px;text-shadow:0 0 3px #fff}
.part{transform-box:fill-box}
.legL,.legR,.armL,.armR{transform-origin:50% 0}
.head{transform-origin:50% 100%}
.eyes{transform-origin:50% 50%;animation:blink 4s infinite}
.mouth{transform-origin:50% 50%}
.tear{opacity:0}
.fx{position:absolute;left:88%;top:0;font-size:24px;opacity:0;pointer-events:none}
.hasfx .fx{animation:fl 1.2s infinite}

/* فقاعة الترجمة فوق الرأس */
.bub{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);width:max-content;max-width:42vw;background:#fff;color:#111;border:2px solid #222;border-radius:10px;padding:3px 8px;font-size:11px;line-height:1.45;text-align:center;z-index:30}
.bub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#222}

@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@keyframes swing{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes mth{from{transform:scaleY(.4)}to{transform:scaleY(2.3)}}
@keyframes gestR{from{transform:rotate(-15deg)}to{transform:rotate(-105deg)}}
@keyframes gestL{from{transform:rotate(15deg)}to{transform:rotate(105deg)}}
@keyframes nod{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes fl{0%{opacity:0;transform:translateY(10px)}50%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
@keyframes tear{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(22px)}}
@keyframes sob{from{transform:translateY(0)}to{transform:translateY(3px)}}

.walk svg{animation:bob .35s ease-in-out infinite}
.walk .legL,.walk .armR{animation:swing .35s ease-in-out infinite alternate}
.walk .legR,.walk .armL{animation:swing .35s ease-in-out infinite alternate-reverse}
.jump svg{animation:jump .55s ease-in-out infinite}
.talk .mouth{animation:mth .2s infinite alternate}
.talk .armR{animation:gestR .55s ease-in-out infinite alternate}
.talk .armL{animation:gestL .7s ease-in-out infinite alternate}
.talk .head{animation:nod .45s ease-in-out infinite alternate}
.ew .armL{animation:none!important;transform:rotate(-70deg)}
.ew .armR{animation:none!important;transform:rotate(70deg)}
.shake .head{animation:shake .28s ease-in-out 6!important}
.cry .tear{animation:tear .8s infinite}
.cry .tear.t2{animation-delay:.35s}
.cry .head{animation:sob .25s ease-in-out infinite alternate}
.lie{bottom:27%}
.lie .fl{transform:rotate(90deg);transform-origin:50% 62%}
</style>
</head>
<body>

<div id="login">
  <input id="pw" type="text" placeholder="Mot de passe" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" dir="auto">
  <button id="go" class="btn" type="button">دخول</button>
  <button id="test" class="btn" type="button">🔊 اختبار الصوت</button>
  <div id="err"></div>
  <div id="status"></div>
</div>

<div id="scene">
  <div id="bg"></div>
  <div id="room"></div>
  <div id="status2"></div>
</div>

<div id="black"></div>

<script>
const SECRET = "عصومي النقش";

const norm = s => s
  .replace(/[\u064B-\u065F\u0640\u200E\u200F]/g, "")
  .replace(/[أإآ]/g, "ا")
  .replace(/ى/g, "ي")
  .replace(/ة/g, "ه")
  .replace(/\s+/g, "")
  .toLowerCase();

const $ = id => document.getElementById(id);
const pw = $("pw"), err = $("err"), black = $("black");
const scene = $("scene"), login = $("login"), room = $("room"), bg = $("bg");
const wait = ms => new Promise(r => setTimeout(r, ms));
function setStatus(t){ $("status").textContent = t; $("status2").textContent = t; }

/* ---------- الخلفيات (مشاهد المدرسة) ---------- */
const BG = {
  yard: `
    <div style="inset:0;background:linear-gradient(#8fd3ff 0 56%,#7cc65a 56%)"></div>
    <div style="left:4%;top:6%;font-size:34px">☀️</div>
    <div style="right:0;top:12%;width:46%;height:46%;background:#c9744a;border:4px solid #7a3f22">
      <div style="left:0;right:0;top:-22px;height:20px;background:#333;color:#fff;font-size:12px;text-align:center;line-height:20px">ثانوية النجاح</div>
      <div style="left:10%;top:14%;width:22%;height:28%;background:#cdeeff;border:3px solid #fff"></div>
      <div style="left:42%;top:14%;width:22%;height:28%;background:#cdeeff;border:3px solid #fff"></div>
      <div style="right:6%;bottom:0;width:20%;height:44%;background:#5a3a1c"></div>
    </div>
    <div style="left:6%;bottom:40%;font-size:70px">🌳</div>
    <div style="left:0;right:0;bottom:0;height:22%;background:#9aa0a6"></div>`,
  class: `
    <div style="left:0;right:0;top:0;height:72%;background:linear-gradient(#f6e8c6,#ead7a8)"></div>
    <div style="left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg,#b98a52 0 60px,#a97a45 60px 62px)"></div>
    <div style="left:24%;width:52%;top:14%;height:24%;background:#1f5a42;border:6px solid #8b5a2b;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#e8f5e8">القسم</div>
    <div style="left:3%;top:14%;width:16%;height:22%;background:linear-gradient(#8fd3ff,#cdeeff);border:5px solid #8b5a2b;border-radius:4px"></div>
    <div class="clock" style="right:4%;top:15%"><i></i></div>
    <div style="left:2%;bottom:17%;width:20%;height:7%;background:#7a5429;border-radius:4px;border-top:4px solid #9b6e38"></div>
    <div style="left:30%;bottom:17%;width:20%;height:7%;background:#7a5429;border-radius:4px;border-top:4px solid #9b6e38"></div>
    <div style="left:58%;bottom:17%;width:20%;height:7%;background:#7a5429;border-radius:4px;border-top:4px solid #9b6e38"></div>
    <div style="left:80%;bottom:17%;width:20%;height:7%;background:#7a5429;border-radius:4px;border-top:4px solid #9b6e38"></div>`,
  hall: `
    <div style="left:0;right:0;top:0;height:72%;background:#bfe3f0"></div>
    <div style="left:0;right:0;top:20%;height:40%;background:repeating-linear-gradient(90deg,#3d7ea6 0 48px,#2f6a8e 48px 52px)"></div>
    <div style="left:30%;width:40%;top:5%;height:12%;background:#fff;border:4px solid #3d7ea6;display:flex;align-items:center;justify-content:center;font-size:18px;color:#222">ساحة الاستراحة 🍎</div>
    <div style="left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg,#d8cdb8 0 70px,#c8bca4 70px 72px)"></div>`,
  bedroom: `
    <div style="left:0;right:0;top:0;height:72%;background:#2d2f5a"></div>
    <div style="left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg,#8a6238 0 60px,#7c562f 60px 62px)"></div>
    <div style="right:10%;top:12%;width:22%;height:26%;background:#0f1236;border:5px solid #8b5a2b;display:flex;align-items:center;justify-content:center;font-size:34px">🌙</div>
    <div style="left:42%;bottom:19%;width:30%;height:5%;background:#a33;border-radius:50%"></div>
    <div style="left:0;bottom:19%;width:22%;height:9%">
      <div style="left:4%;bottom:60%;width:28%;height:35%;background:#fff;border:3px solid #556;border-radius:10px"></div>
      <div style="left:0;right:0;bottom:30%;height:50%;background:#e8e8f5;border:3px solid #556;border-radius:6px"></div>
      <div style="left:4%;bottom:0;width:6%;height:35%;background:#6b4a26"></div>
      <div style="right:4%;bottom:0;width:6%;height:35%;background:#6b4a26"></div>
    </div>
    <div style="left:56%;top:30%;font-size:26px">💡</div>`
};

/* ---------- الشخصيات ---------- */
const CH = {
  c1:{name:"عصومي", skin:"#f2c9a0", hair:"#3a2a1a", shirt:"#3b6fd4", pants:"#2d3a66", style:"messy", rate:1.1, pitch:1.15, vi:0},
  c2:{name:"الشاب العجال", skin:"#e0a878", hair:"#222", shirt:"#555", pants:"#222", style:"cap", rate:0.85, pitch:0.3, vi:1},
  c3:{name:"أكرم", skin:"#f0c8a8", hair:"#6b3d12", shirt:"#2a9d5c", pants:"#334", style:"spiky", rate:1.0, pitch:0.7, vi:2},
  c4:{name:"رانيا", skin:"#f6d3b8", hair:"#2b1b12", shirt:"#e0508f", pants:"#f6d3b8", style:"long", rate:1.25, pitch:1.9, vi:3}
};

function drawChar(id){
  const c = CH[id];
  let back = "", front = "", glasses = "";
  if(c.style === "long"){
    back = `<ellipse cx="50" cy="52" rx="33" ry="42" fill="${c.hair}"/>`;
    front = `<path d="M24 38 Q50 6 76 38 Q50 24 24 38Z" fill="${c.hair}"/>`;
  } else if(c.style === "messy"){
    front = `<path d="M24 36 L30 14 L40 28 L48 8 L58 28 L68 12 L76 36 Q50 20 24 36Z" fill="${c.hair}"/>`;
  } else if(c.style === "spiky"){
    front = `<path d="M24 34 L28 10 L38 26 L50 4 L62 26 L72 10 L76 34 Q50 22 24 34Z" fill="${c.hair}"/>`;
  } else if(c.style === "cap"){
    front = `<path d="M22 34 Q50 0 78 34Z" fill="#d33"/><rect x="60" y="30" width="30" height="7" rx="3" fill="#a22"/>`;
    glasses = `<rect x="30" y="36" width="18" height="10" rx="3" fill="#111"/><rect x="52" y="36" width="18" height="10" rx="3" fill="#111"/><rect x="47" y="39" width="6" height="3" fill="#111"/>`;
  }
  const eyes = c.style === "cap" ? glasses :
    `<circle cx="40" cy="42" r="6" fill="#fff"/><circle cx="60" cy="42" r="6" fill="#fff"/>
     <circle cx="42" cy="43" r="3" fill="#111"/><circle cx="62" cy="43" r="3" fill="#111"/>`;
  const body = c.style === "long"
    ? `<path d="M30 70 L70 70 L82 118 L18 118Z" fill="${c.shirt}"/>`
    : `<rect x="28" y="70" width="44" height="42" rx="10" fill="${c.shirt}"/>`;
  return `<svg viewBox="0 0 100 150">
    ${back}
    <g class="part legL"><rect x="35" y="108" width="11" height="28" rx="4" fill="${c.pants}"/><ellipse cx="41" cy="138" rx="10" ry="5" fill="#222"/></g>
    <g class="part legR"><rect x="54" y="108" width="11" height="28" rx="4" fill="${c.pants}"/><ellipse cx="60" cy="138" rx="10" ry="5" fill="#222"/></g>
    ${body}
    <g class="part armL"><line x1="26" y1="74" x2="26" y2="104" stroke="${c.skin}" stroke-width="8" stroke-linecap="round"/></g>
    <g class="part armR"><line x1="74" y1="74" x2="74" y2="104" stroke="${c.skin}" stroke-width="8" stroke-linecap="round"/></g>
    <g class="part head">
      <circle cx="50" cy="44" r="27" fill="${c.skin}" stroke="#222" stroke-width="2.5"/>
      ${front}
      <g class="part eyes">${eyes}</g>
      <path d="M32 33 Q40 29 46 33" stroke="#222" stroke-width="2" fill="none"/>
      <path d="M54 33 Q60 29 68 33" stroke="#222" stroke-width="2" fill="none"/>
      <ellipse class="part mouth" cx="50" cy="58" rx="7" ry="3" fill="#7a1f1f"/>
      <ellipse class="tear t1" cx="40" cy="52" rx="2.5" ry="4" fill="#4aa8ff"/>
      <ellipse class="tear t2" cx="61" cy="52" rx="2.5" ry="4" fill="#4aa8ff"/>
    </g>
  </svg>`;
}

for(const id in CH){
  const d = document.createElement("div");
  d.className = "ch";
  d.id = id;
  d.innerHTML = `<div class="bub"></div><div class="fx"></div><div class="fl">${drawChar(id)}</div><div class="nm">${CH[id].name}</div>`;
  room.appendChild(d);
}

/* ---------- الحركة ---------- */
function face(id, left){ $(id).classList.toggle("flip", left); }

function place(id, left, faceLeft){
  const el = $(id);
  el.style.transitionDuration = "0ms";
  el.classList.remove("lie", "cry", "ew", "shake", "walk", "talk", "jump", "hasfx");
  el.style.left = left + "%";
  el.classList.add("show");
  face(id, !!faceLeft);
  void el.offsetWidth;
}

async function walk(id, to){
  const el = $(id);
  const from = parseFloat(el.style.left);
  face(id, to < from);
  const dur = Math.max(300, Math.abs(to - from) * 70);
  el.style.transitionDuration = dur + "ms";
  el.classList.add("walk");
  el.style.left = to + "%";
  await wait(dur + 60);
  el.classList.remove("walk");
}

async function newScene(name, title, setup){
  black.style.display = "flex";
  black.textContent = title;
  for(const id in CH){ $(id).classList.remove("show"); }
  bg.innerHTML = BG[name] || "";
  if(setup) setup();
  await wait(2200);
  black.style.display = "none";
  await wait(400);
}

/* ---------- الصوت (صوت الشخصيات) ---------- */
const player = new Audio();
player.preload = "auto";
player.volume = 1;
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";

function deviceSpeak(text, c){
  return new Promise(res => {
    let started = false, done = false;
    const end = v => { if(done) return; done = true; res(v); };
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ar-SA";
      const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("ar"));
      if(vs.length){ u.voice = vs[c.vi % vs.length]; u.lang = u.voice.lang; }
      u.pitch = c.pitch; u.rate = c.rate; u.volume = 1;
      u.onstart = () => { started = true; };
      u.onend = () => end(true);
      u.onerror = () => end(started);
      setTimeout(() => { try{ speechSynthesis.speak(u); }catch(e){ end(false); } }, 80);
    }catch(e){ end(false); }
    setTimeout(() => { if(!started){ try{ speechSynthesis.cancel(); }catch(e){} end(false); } }, 2800);
    setTimeout(() => end(started), Math.max(8000, text.length * 230 + 4000));
  });
}

function playUrl(url, rate, maxMs){
  return new Promise(res => {
    let started = false, done = false;
    const end = v => { if(done) return; done = true; player.onplaying = player.onended = player.onerror = null; res(v); };
    player.onplaying = () => { started = true; };
    player.onended = () => end(true);
    player.onerror = () => end(started);
    try{
      player.src = url;
      player.playbackRate = rate;
      try{ player.preservesPitch = false; player.webkitPreservesPitch = false; player.mozPreservesPitch = false; }catch(e){}
      const p = player.play();
      if(p && p.catch) p.catch(() => end(false));
    }catch(e){ end(false); }
    setTimeout(() => { if(!started) end(false); }, 5000);
    setTimeout(() => end(started), maxMs);
  });
}

async function speak(text, c){
  if(await deviceSpeak(text, c)) return "صوت الجهاز";
  const q = encodeURIComponent(text);
  const urls = [
    ["Google 1", "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=" + q],
    ["Google 2", "https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=ar&q=" + q]
  ];
  const maxMs = Math.max(8000, text.length * 280 + 4000);
  for(const [name, url] of urls){
    if(await playUrl(url, c.rate, maxMs)) return name;
  }
  return null;
}

/* ---------- الكلام: الفقاعة فوق الرأس ---------- */
function clampBubble(b){
  b.style.marginLeft = "0px";
  const r = b.getBoundingClientRect();
  const W = window.innerWidth;
  let s = 0;
  if(r.left < 4) s = 4 - r.left;
  else if(r.right > W - 4) s = (W - 4) - r.right;
  b.style.marginLeft = s + "px";
}

async function say(id, text, fx, jump){
  const c = CH[id], el = $(id), b = el.querySelector(".bub");
  el.classList.add("talk");
  if(jump) el.classList.add("jump");
  if(fx){ el.querySelector(".fx").textContent = fx; el.classList.add("hasfx"); }
  b.textContent = text;
  b.style.display = "block";
  clampBubble(b);
  const used = await speak(text, c);
  if(used) setStatus("🔊 الصوت: " + used);
  else{
    setStatus("⚠ لا يوجد صوت متاح في هذا الجهاز/المتصفح");
    await wait(Math.max(2000, text.length * 90));
  }
  b.style.display = "none";
  el.classList.remove("talk", "jump", "hasfx");
  await wait(350);
}

async function react(id, fx, ms, jump){
  const el = $(id);
  el.querySelector(".fx").textContent = fx;
  el.classList.add("hasfx");
  if(jump) el.classList.add("jump");
  await wait(ms);
  el.classList.remove("hasfx", "jump");
}

/* ---------- الحلقة ---------- */
async function play(){
  login.style.display = "none";
  scene.style.display = "block";

  // العنوان
  black.style.display = "flex";
  black.textContent = "الحلقة الأولى: الشجاعة 🎬";
  await wait(2500);
  black.style.display = "none";

  /* المشهد 1: ساحة المدرسة */
  await newScene("yard", "المشهد 1: ساحة المدرسة 🏫", () => {
    place("c3", 38, false);
    place("c2", 80, true);
    place("c1", -20, false);
    place("c4", 112, true);
  });
  await walk("c1", 20);
  face("c1", false); face("c3", true);
  await say("c3", "صباح الخير يا عصومي، هل أنت جاهز للحصة؟");
  await say("c1", "صباح النور يا أكرم، أنا نعسان قليلاً.");
  await walk("c4", 60);
  face("c4", true);
  await say("c4", "صباح الخير للجميع.");
  face("c1", false);
  await react("c1", "❤️", 1800, true);
  await walk("c4", 112);
  await say("c2", "هيا بنا، سيرنّ الجرس الآن.");

  /* المشهد 2: داخل القسم */
  await newScene("class", "المشهد 2: داخل القسم 📚", () => {
    place("c2", 62, true);
    place("c1", -20, false);
  });
  await walk("c1", 44);
  face("c1", false); face("c2", true);
  await say("c1", "يا صاحبي، أنا أحب رانيا.", "❤️");
  await say("c2", "ممتاز! اسمع الخطة: خذ نفساً عميقاً، ثم تحدث إليها بثقة ولا تخف أبداً. أنت قادر على الاعتراف لها.", "💡");
  await say("c1", "شكراً لك، أعطيتني الشجاعة.", "✨", true);

  /* المشهد 3: بعد مرور ساعات */
  black.style.display = "flex";
  black.textContent = "بعد مرور ساعات";
  for(const id in CH){ $(id).classList.remove("show"); }
  await wait(3000);
  black.style.display = "none";

  /* المشهد 4: ساحة الاستراحة */
  await newScene("hall", "المشهد 3: وقت الاستراحة 🍎", () => {
    place("c4", 72, true);
    place("c3", -20, false);
    place("c1", 4, false);
  });
  await walk("c3", 52);
  face("c3", false); face("c4", true);
  await say("c3", "يا رانيا، إن الشاب المرفوض يحبك.", "💬");
  const r = $("c4");
  r.classList.add("ew", "shake");
  await say("c4", "عققق، هذاك نقش!", "🤢");
  await wait(700);
  r.classList.remove("shake");
  await react("c3", "😂", 1800, true);

  /* المشهد 5: غرفة عصومي */
  await newScene("bedroom", "المشهد 4: في المساء 🌙", () => {
    place("c1", -20, false);
  });
  const a = $("c1");
  a.classList.add("cry");
  await walk("c1", 40);
  face("c1", true);
  await say("c1", "آآآه... سأذهب إلى سريري.", "😭");
  await walk("c1", 1);
  face("c1", false);
  a.classList.remove("walk");
  a.style.transitionDuration = "600ms";
  a.classList.add("lie");
  await wait(1000);
  a.classList.remove("cry");
  await react("c1", "💤", 3500);

  black.style.display = "flex";
  black.textContent = "نهاية الحلقة 🎬";
}

/* ---------- الدخول والاختبار ---------- */
function unlockAudio(){
  try{
    player.src = SILENT;
    const p = player.play();
    if(p && p.catch) p.catch(() => {});
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
  }catch(e){}
}

let started = false;
function check(){
  if(started) return;
  if(norm(pw.value) === norm(SECRET)){
    started = true;
    err.textContent = "";
    unlockAudio();
    play();
  } else {
    err.textContent = "Mot de passe incorrect";
  }
}

$("test").addEventListener("click", async () => {
  setStatus("... جاري اختبار الصوت");
  const used = await speak("مرحبا، هذا اختبار للصوت", CH.c1);
  setStatus(used ? "✅ الصوت يعمل: " + used : "⚠ لا يوجد صوت متاح: تأكد من الإنترنت ومن رفع الصوت وإلغاء الوضع الصامت");
});

pw.addEventListener("keydown", e => { if(e.key === "Enter") check(); });
$("go").addEventListener("click", check);
</script>
